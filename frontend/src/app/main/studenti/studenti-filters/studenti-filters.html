<div class="row g-4 justify-content-center container-filters mx-2 mx-sm-3 mx-md-5 my-4 p-3 rounded-3">
    <!-- filtri-->
    <div
        class="col-12 col-sm-6 col-md-7 col-lg-8 mt-0 d-flex align-items-center gap-2 gap-lg-4 ps-0 ps-sm-1 pe-0 pe-lg-2">
        <i class="bi bi-funnel fs-4"></i>
        <input type="text" class="form-control rounded-3 border-0 shadow-lg px-3 py-2" placeholder="Cerca studente..."
            [(ngModel)]="searchTerm" (input)="Search()">
    </div>
    <div
        class="col-12 col-sm-6 col-md-5 col-lg-4 mt-0 d-flex align-items-center gap-2 gap-lg-4 pe-0 ps-0 ps-sm-2 mt-4 mt-sm-0">
        <i class="bi bi-sort-alpha-down fs-4"></i>
        <select class="form-control form-select rounded-3 border-0 shadow-lg px-3 py-2"
            aria-label="Default select example" [(ngModel)]="orderValue" (change)="Search()">
            <option selected value="Nome">
                Ordina per nome
            </option>
            <option value="Cognome">
                Ordina per cognome
            </option>
        </select>
    </div>
    <div class="col-12 col-md-10 col-lg-8 d-flex justify-content-center gap-3">
        <button class="flex-fill active badges-filter" (click)="SetFilterDSA_BES(-1)" id="badges-all">Tutti</button>
        <button id="badges-dsa" class="flex-fill badges-filter" (click)="SetFilterDSA_BES(true)">DSA</button>
        <button id="badges-bes" class="flex-fill badges-filter" (click)="SetFilterDSA_BES(false)">BES</button>
    </div>
</div>
