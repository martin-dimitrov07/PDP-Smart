<div class="container-fluid container-card p-0 mx-0">
    <button (click)="GoStudent()"
        class="studente-card d-flex align-items-sm-center gap-3 gap-sm-4 gap-lg-3 gap-xl-4 py-4 px-3 w-100 border-0 rounded-4 position-relative h-100">
        <div class="icon-box p-3 shadow border-0">
            <p class="m-0 fw-bold">{{ studente.GetInitials() }}</p>
        </div>
        <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-evenly gap-3 gap-md-4 gap-lg-3 gap-xl-4 flex-grow-1">
            <div class="d-flex flex-column gap-2 flex-grow-1 text-start">
                <h3 class="fs-5 m-0">{{ studente.GetFullName() }}</h3>
                <p class="m-0 extra-small small third-text-color">
                    {{ studente.Email }}
                </p>
            </div>
            <div class="w-100 d-flex align-items-center justify-content-sm-end">
                @if(studente.DSA_BES)
                {
                <span class="badge badge-dsa">DSA</span>
                }
                @else
                {
                <span class="badge badge-bes">BES</span>
                }
            </div>
            <div class="d-none d-sm-block card-arrow-document">
                <i class="bi bi-chevron-right"></i>
            </div>
        </div>
    </button>
</div>
