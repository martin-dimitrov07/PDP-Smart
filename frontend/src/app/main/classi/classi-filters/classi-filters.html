<div class="sezione-card d-flex align-items-center mb-3">
    <div class="d-flex align-items-center gap-2 gap-sm-4 px-4 px-sm-4 w-100">
        <div class="icon-box shadow"><i class="bi" [ngClass]="IconClass"></i></div>
        <div class="flex-grow-1">
            <h2 class="sigla text-start text-white fs-3 lh-1 m-0">{{this.studentiService.indirizzoSelected}}</h2>
        </div>
        <div class="icon-box p-3 shadow" style="width: auto !important;">
            @if (studentiService.nClassi == 1) {
            <p class="m-0 fw-bold">{{studentiService.nClassi}} classe</p>
            }
            @else {
            <p class="m-0 fw-bold">{{studentiService.nClassi}} classi</p>
            }
        </div>
    </div>
</div>

<div class="d-flex flex-wrap flex-md-nowrap justify-content-center gap-3 gap-xl-5 px-3 px-md-5 my-4" id="annoTabs">
    <button class="col-5 col-sm-3 flex-md-fill anno-tab all active" (click)="SetFilterAnno(0)"
        id="anno-all">Tutte</button>
    <button id="anno-1" class="col-5 col-sm-3 flex-md-fill anno-tab" (click)="SetFilterAnno(1)">1° Anno</button>
    <button id="anno-2" class="col-5 col-sm-3 flex-md-fill anno-tab" (click)="SetFilterAnno(2)">2° Anno</button>
    <button id="anno-3" class="col-5 col-sm-3 flex-md-fill anno-tab" (click)="SetFilterAnno(3)">3° Anno</button>
    <button id="anno-4" class="col-5 col-sm-3 flex-md-fill anno-tab" (click)="SetFilterAnno(4)">4° Anno</button>
    <button id="anno-5" class="col-5 col-sm-3 flex-md-fill anno-tab" (click)="SetFilterAnno(5)">5° Anno</button>
</div>
