<button class="indirizzo-card position-relative d-flex align-items-center bg-white border shadow-sm w-100"
    [appIndirizziStyle]="indirizzo" #styleDir="indirizziStyle" (click)="GoClassi(indirizzo)">

    <div class="overlay"></div>
    <div class="left-bar align-self-stretch"></div>

    <div class="d-flex align-items-center gap-3 gap-sm-4 px-2 px-sm-4 w-100 position-relative z-1">
        <div class="icon-box">
            <i class="bi" [ngClass]="styleDir.GetIcon(indirizzo)"></i>
        </div>
        <div class="flex-grow-1 text-start">
            <h2 class="sigla fs-3 lh-1 mb-1">{{ indirizzo }}</h2>
            <p class="text-secondary small m-0">{{ styleDir.GetDescrizione(indirizzo) }}</p>
        </div>
        <i class="bg-icon bi" [ngClass]="styleDir.GetIcon(indirizzo)"></i>
        <div class="arrow-btn bg-light text-secondary">
            <i class="bi bi-chevron-right"></i>
        </div>
    </div>
</button>
