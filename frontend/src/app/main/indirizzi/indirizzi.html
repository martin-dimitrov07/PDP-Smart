<section class="container-xl px-0 py-5 mx-auto">
    <div class="mb-4">
        <h1 class="mb-1 fs-2 text-dark-color">
            Seleziona l'indirizzo
        </h1>
        <p class="text-secondary">Scegli l'indirizzo scolastico</p>
    </div>

    <div class="row w-100 mx-auto justify-content-center g-4">
        @for (indirizzo of studentiService.indirizzi; track $index) {
            <div class="col-lg-6">
                <app-indirizzi-card [indirizzo]="indirizzo"></app-indirizzi-card>
            </div>
        }
    </div>
</section>
