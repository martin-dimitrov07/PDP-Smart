<button (click)="documento.Stato == StatoDocumento.IN_BOZZA ? GoEdit() : null" 
    class="btn-card justify-content-between d-flex align-items-center gap-3 gap-sm-4 gap-lg-3 gap-xl-4 py-4 px-3 w-100 border-0 rounded-4 position-relative h-100"
    [ngClass]="{'documento-card': documento.Stato == StatoDocumento.IN_BOZZA}">

    <div class="d-flex gap-3 align-items-center">
        <div class="icon-box p-3 shadow border-0">
            <i class="bi bi-file-earmark-text-fill"></i>
        </div>

        <div class="d-flex flex-column gap-3 align-items-start">

            <p class="p-0 m-0 text-start third-text-color extra-small small">
                {{documento.Studente_Email}}
            </p>

            <div class="d-flex gap-1 align-items-strech flex-wrap">
                <span class="badge badge-anno">
                    {{documento.Anno!.getFullYear().toString()}}/{{(documento.Anno!.getFullYear() + 1).toString()}}
                </span>

                @if(documento.Tipologia == TipoDocumento.DSA) {
                <span class="badge badge-dsa">DSA</span>
                } @else {
                <span class="badge badge-bes">BES</span>
                }

                @if(documento.Stato == StatoDocumento.IN_BOZZA) {
                <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle">
                    In Bozza
                </span>
                } @else if(documento.Stato == StatoDocumento.SCADUTO) {
                <span class="badge bg-danger-subtle text-danger-emphasis border border-danger-subtle">
                    Scaduto
                </span>
                }@else if(documento.Stato == StatoDocumento.VALIDATO) {
                <span class="badge bg-success-subtle text-success-emphasis border border-success-subtle">
                    Validato
                </span>
                }

                <div class="d-flex d-sm-none gap-1">
                    <button type="button" (click)="$event.stopPropagation(); ShowDocumento();"
                        class="btn btn-sm d-flex justify-content-center align-items-center action-btn">
                        <i class="bi bi-download"></i>
                    </button>

                    @if ((canDelete | async) && documento.Stato == StatoDocumento.IN_BOZZA) {
                    <button type="button" (click)="$event.stopPropagation(); DeleteDocument()"
                        class="btn btn-sm d-flex justify-content-center align-items-center action-btn delete-btn">
                        <i class="bi bi-trash"></i>
                    </button>
                    }
                </div>
            </div>
        </div>
    </div>


    <div class="d-none d-sm-flex flex-column gap-2">
        <button type="button" class="btn btn-sm d-flex justify-content-center align-items-center action-btn"
            (click)="$event.stopPropagation(); ShowDocumento()">
            <i class="bi bi-download"></i>
        </button>

        @if ((canDelete | async) && documento.Stato == StatoDocumento.IN_BOZZA) {
        <button type="button" class="btn btn-sm d-flex justify-content-center align-items-center action-btn delete-btn"
            (click)="$event.stopPropagation(); DeleteDocument()">
            <i class="bi bi-trash"></i>
        </button>
        }
    </div>

</button>
