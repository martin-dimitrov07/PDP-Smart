<section class="container-lg py-5 px-3 px-sm-4 px-md-5 px-lg-0">
    <div class="mb-4">
        <h1 class="mb-1 fs-2 text-dark-color">Documenti</h1>
        <p class="text-secondary">Seleziona un'operazione sui documenti</p>
    </div>

    <div class="row g-4 p-0">

        <!-- Lista documenti -->
        <div class="col-md-6">
            <app-documenti-option-card [option]="{
                title: 'Lista',
                description: 'Visualizza e gestisci i tuoi documenti',
                icon: 'bi bi-file-earmark-text',
                route: '/documenti/lista'
            }"></app-documenti-option-card>

        </div>
        <div class="col-md-6">
            <app-documenti-option-card [option]="{
                title: 'Crea documento',
                description: 'Crea un nuovo documento',
                icon: 'bi bi-file-earmark-plus',
                route: '/documenti/crea'
            }"></app-documenti-option-card>
        </div>
    </div>
</section>
