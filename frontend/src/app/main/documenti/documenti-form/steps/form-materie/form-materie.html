<div class="container-lg pt-2 pb-4">
    <section class="section-form">
        <h3 class="fs-5">Seleziona le materia</h3>
        <hr>

        <div class="py-2 px-sm-3 d-flex flex-column gap-3">
            <div class="row g-2">
                @if(documentiService.materieSelected && documentiService.materieSelected.length > 0)
                {
                    @for (materia of documentiService.materieSelected; track $index) {
                    <div class="col-4 px-2" style="max-width: 350px !important;">
                        <div class="card">
                            <div class="card-body d-flex gap-3 align-items-center justify-content-between">
                                <div>
                                    <h5 class="card-title m-0">{{materia}}</h5>
                                </div>
                                <i class="bi bi-x-lg text-danger" (click)="RemoveMateria(materia)"
                                    style="cursor: pointer;"></i>
                            </div>
                        </div>
                    </div>
                    }
                }
            </div>

            <button class="btn-add d-flex align-items-center justify-content-center" data-bs-toggle="modal"
                data-bs-target="#aggiuntaMateria">
                <i class="bi bi-plus-circle fs-5 secondary-text-color"></i>
                <span class="text-add secondary-text-color">Aggiungi nuova materia</span>
            </button>
        </div>
    </section>

    <div class="d-flex justify-content-between">
        @if(documentiService.materieSelected.length
        < 1) { <span class="text-add secondary-text-color">
            Nessuna materia selezionata
            </span>
            }

            <button type="button" class="btn btn-primary d-flex gap-2 align-items-center ms-auto"
                (click)="SaveMaterie()">
                <p class="m-0">Avanti</p>
                <i class="bi bi-chevron-right"></i>
            </button>
    </div>


    <!-- MODAL AGGIUNTA STUDENTE -->
    <app-modal-add-materia (materiaEvent)="SaveMateria($event)"></app-modal-add-materia>
</div>
