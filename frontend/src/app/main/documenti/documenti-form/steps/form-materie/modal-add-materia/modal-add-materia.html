    <div class="modal fade" id="aggiuntaMateria" tabindex="-1"
        aria-labelledby="aggiuntaMateriaLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title fs-5" id="aggiuntaMateriaLabel">Aggiungi nuova materia</h3>
                </div>
                <div class="modal-body">
                    <label for="materiaSelected" class="form-label">Materia</label>
                    <select class="form-select" id="materiaSelected" name="materiaSelected" [(ngModel)]="materia">
                        @if(documentiService.materie && documentiService.materie.length > 0) {
                        @for (nomeMateria of documentiService.materie; track $index) {
                        <option [value]="nomeMateria">{{nomeMateria}}</option>
                        }
                        }
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Annulla</button>
                    <button type="button" class="btn btn-primary" (click)="SaveMateria()" data-bs-dismiss="modal">Salva aggiunta</button>
                </div>
            </div>
        </div>
    </div>
