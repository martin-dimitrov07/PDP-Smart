<div class="container-lg pt-2 pb-4">
    <section class="section-form px-3 px-sm-5">
        <h3 class="fs-5">Inserisci gli ICF</h3>
        <hr>

        <div class="py-2 px-sm-3 d-flex flex-column gap-3">
            <div class="d-flex g-2 gap-3 flex-wrap">
                @if(documentiService.icfsSelected && documentiService.icfsSelected.length > 0)
                {
                    @for (icf of documentiService.icfsSelected; track $index) {
                        <div class="card" style="max-width: 350px !important;">
                            <div class="card-body d-flex gap-3 align-items-center justify-content-between">
                                <div class="d-flex flex-column gap-2">
                                    <h5 class="card-title m-0">{{icf.Codice.toUpperCase()}}</h5>
                                    <p class="m-0">{{icf.Descrizione}}</p>
                                </div>
                                <i class="bi bi-x-lg text-danger" style="cursor: pointer;" (click)="RemoveICF(icf.Codice)"></i>
                            </div>
                        </div>
                    }
                }
            </div>

            <button class="btn-add d-flex align-items-center justify-content-center" data-bs-toggle="modal"
                data-bs-target="#aggiuntaMateria">
                <i class="bi bi-plus-circle fs-5 secondary-text-color"></i>
                <span class="text-add secondary-text-color">Aggiungi nuovo ICF</span>
            </button>
        </div>
    </section>

    <div class="d-flex justify-content-between flex-wrap">
        <button type="button" class="btn btn-secondary d-flex gap-2 align-items-center py-2 pe-3 ps-2" (click)="SetPrevPage()">
            <i class="bi bi-chevron-left"></i>
            <p class="m-0">Indietro</p>
        </button>

        <button type="button" class="btn btn-primary d-flex gap-2 align-items-center py-2 ps-3 pe-2 border-0" (click)="GoStep('allegati')">
            <p class="m-0">Avanti</p>
            <i class="bi bi-chevron-right"></i>
        </button>
    </div>

    <!-- MODAL AGGIUNTA ICF -->
    <app-modal-add-icf (icfEvent)="SaveICF($event)"></app-modal-add-icf>
</div>
