<div class="container-lg">
    <section class="section-form">
        <h3 class="fs-5">Seleziona gli studenti</h3>
        <hr>

        <div class="py-2 px-sm-3 d-flex flex-column gap-3">
            <div class="row g-2">
                @for (studente of documentiService.studentiSelected; track $index)
                {
                <div class="col-4 px-2" style="max-width: 350px !important;">
                    <div class="card">
                        <div class="card-body d-flex gap-3 align-items-center justify-content-between">
                            <div>
                                <h5 class="card-title">{{studente.GetFullName()}}</h5>
                                <p class="card-text">{{studente.Email}}</p>
                            </div>
                            <i class="bi bi-x-lg text-danger" (click)="RemoveStudente(studente.Email)"
                                style="cursor: pointer;"></i>
                        </div>
                    </div>
                </div>
                }
            </div>

            <button class="btn-add d-flex align-items-center justify-content-center" data-bs-toggle="modal"
                data-bs-target="#aggiuntaStudente">
                <i class="bi bi-plus-circle fs-5 secondary-text-color"></i>
                <span class="text-add secondary-text-color">Aggiungi nuovo studente</span>
            </button>
        </div>
    </section>

    <div class="d-flex justify-content-between">
        @if(documentiService.studentiSelected.length < 1) { 
            <span class="text-add secondary-text-color">
                Nessun studente selezionato
            </span>
        }
        @else
        {
            <button type="button" class="btn btn-primary d-flex gap-2 align-items-center ms-auto"
                (click)="SaveStudenti()">
                <p class="m-0">Avanti</p>
                <i class="bi bi-chevron-right"></i>
            </button>
        }
    </div>


    <!-- MODAL AGGIUNTA STUDENTE -->
    <app-modal-add-studente (studenteEvent)="SaveStudente($event)"></app-modal-add-studente>
</div>
