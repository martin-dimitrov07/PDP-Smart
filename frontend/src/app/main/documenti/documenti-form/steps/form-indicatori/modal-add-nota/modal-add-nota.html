    <div class="modal fade" id="aggiuntaNota" tabindex="-1"
        aria-labelledby="aggiuntaStudenteLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title fs-5" id="aggiuntaStudenteLabel">Aggiungi nuova nota</h3>
                </div>
                <div class="modal-body">
                    <label for="classeSelected" class="form-label">Nota</label>
                    <textarea class="form-control" id="notaInput" rows="3" [(ngModel)]="documentiService.indicatoreSelected.Nota" placeholder="Scrivi qui la tua nota..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary" (click)="ResetNota()" data-bs-dismiss="modal">Annulla nota</button>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Salva nota</button>
                </div>
            </div>
        </div>
    </div>
