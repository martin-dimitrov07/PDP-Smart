<div class="container-lg pt-2 pb-4">
    <section class="section-form px-3 px-sm-5">
        <h3 class="fs-5">Inserisci gli allegati</h3>
        <hr>
        <!-- Area di drop principale -->
        <div class="dropzone-wrapper">
            <ngx-dropzone (change)="onSelect($event)" [multiple]="false" class="custom-dropzone p-3">

                <ngx-dropzone-label class="dropzone-content">
                    <i class="bi bi-folder-plus secondary-text-color fs-1"></i>
                    <h3 class="fs-2 secondary-text-color m-0">Trascina i file qui</h3>
                    <div class="mb-3">
                        <p class="m-0">oppure</p>
                        <span class="secondary-text-color text-decoration-underline">sfoglia i tuoi documenti</span>
                    </div>
                    <small class="opacity-75">Dimensione massima: 5MB</small>
                </ngx-dropzone-label>

                <div class="d-flex gap-3 flex-wrap justify-content-center">
                    @for (file of allegati; track $index)
                    {
                    <ngx-dropzone-image-preview ngProjectAs="ngx-dropzone-preview" [file]="file" [removable]="true"
                        (removed)="onRemove(file)">
                        <ngx-dropzone-label>{{ file.name }}</ngx-dropzone-label>
                    </ngx-dropzone-image-preview>
                    }
                </div>

            </ngx-dropzone>
        </div>
    </section>

    <div class="d-flex justify-content-between flex-wrap">
        <button type="button" class="btn btn-secondary d-flex gap-2 align-items-center py-2 pe-3 ps-2"
            (click)="stepsService.GoStep('ICF')">
            <i class="bi bi-chevron-left"></i>
            <p class="m-0">Indietro</p>
        </button>

        <button type="button" class="btn btn-primary d-flex gap-2 align-items-center py-2 px-3 border-0 fw-bold">
            <p class="m-0">Crea Documento</p>
        </button>
    </div>
</div>
