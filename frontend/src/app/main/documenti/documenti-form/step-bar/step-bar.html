<!-- STEP BAR -->
<div class="step-bar mt-5 mb-2 px-2 px-sm-5">
    <div class="sp studenti"
        [class.active]="isStepActive('studenti')" id="sp1" (click)="GoPage('studenti')">
        <div class="dot">1</div>
        <p class="sp-text m-0" [class.fw-bold]="this.stepsService.step === 'studenti'">Studente</p>
    </div>

    <div class="sp-line" [class.active]="isStepActive('indicatori')">
