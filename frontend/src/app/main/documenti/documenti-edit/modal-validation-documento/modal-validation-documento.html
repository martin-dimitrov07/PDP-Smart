    <div class="modal fade" id="confirmValidation" tabindex="-1"
        aria-labelledby="confirmValidationLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title fs-5" id="confirmValidationLabel">Conferma Approvazione</h3>
                </div>
                <div class="modal-body">
                    Sei sicuro di voler approvare questo documento? <br> Una volta approvato, non potrà più essere modificato.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Annulla</button>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="validateDocumento()">Sì, conferma</button>
                </div>
            </div>
        </div>
    </div>
