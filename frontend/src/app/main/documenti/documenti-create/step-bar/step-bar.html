<!-- STEP BAR -->
<div class="step-bar mt-5 mb-2 px-2 px-sm-5">
    <div class="sp studenti" [class.active]="isStepActive('studenti')" (click)="GoPage('studenti')">
        <div class="dot">1</div>
        <p class="sp-text m-0" [class.fw-bold]="this.stepsService.step === 'studenti'">Studente</p>
    </div>

    <div class="sp-line" [class.active]="isStepActive('indicatori')">
    </div>
    <div class="sp indicatori" [class.active]="isStepActive('indicatori')" (click)="GoPage('indicatori')">
        <div class="dot">2</div>
        <p class="sp-text m-0" [class.fw-bold]="this.stepsService.step === 'indicatori'">Indicatori</p>
    </div>

    @if(docentiService.docente.Ruolo == Ruolo.ADMIN) {
    <div class="sp-line" [class.active]="isStepActive('icf')">
    </div>
    <div class="sp icf" [class.active]="isStepActive('icf')" (click)="GoPage('icf')">
        <div class="dot">3</div>
        <p class="sp-text m-0" [class.fw-bold]="this.stepsService.step === 'icf'">ICF</p>

    </div>
    }

    <div class="sp-line" [class.active]="isStepActive('allegati')">
    </div>
    <div class="sp allegati" [class.active]="isStepActive('allegati')" (click)="GoPage('allegati')">
        <div class="dot">@if(docentiService.docente.Ruolo == Ruolo.ADMIN) { 4 } @else { 3 }</div>
        <p class="sp-text m-0" [class.fw-bold]="this.stepsService.step === 'allegati'">Allegati</p>
    </div>
</div>
