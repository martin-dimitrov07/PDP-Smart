<div class="form-card d-flex justify-content-center align-items-center flex-column gap-3 p-4 rounded-4">
    <img src="imgs/logos/vallauri/img-logo-noback.png" alt="immagine logo sito" class="img-logo-vallauri rounded-3">
    <h3 class="secondary-text-color">
        Benvenuto
    </h3>
    <p class="third-text-color text-center">
        Accedi per gestire i documenti PDP dei tuoi studenti
    </p>

    @if (isLoading) {
    <div class="d-flex justify-content-center my-2">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    }

    <div class="myGoogleDiv" [ngClass]="{ 'd-none': isLoading }"></div>

    <div class="divider">
        <p class="m-0 third-text-color text-nowrap px-2">Accesso Istituzionale</p>
    </div>

    <div class="info-login d-flex gap-3 rounded-4 h-100 p-3">
        <i class="bi bi-book my-auto m-lg-0"></i>
        <div class="d-flex flex-column justify-content-center justify-content-lg-start gap-2">
            <h3 class="secondary-text-color fs-6 align-content-center m-0">Accesso riservato ai docenti</h3>
            <p class="third-text-color m-0">
                Utilizza il tuo account Google Istituzionale (<span
                    class="text-decoration-underline">@vallauri.edu</span>) per accedere
                alla piattaforma.
            </p>
        </div>
    </div>
</div>
